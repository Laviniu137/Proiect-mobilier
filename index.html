<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proiect mobilier</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>Proiect mobilier</h1>
      <p>Variantă minimă funcțională (MVP)</p>
    </header>

    <main>
      <section>
        <h2>Produse</h2>
        <div id="products" class="grid"></div>
      </section>

      <aside class="cart">
        <h2>Coș</h2>
        <ul id="cart-items"></ul>
        <p><strong>Total:</strong> <span id="total">0</span> RON</p>
        <button id="clear-cart">Golește coșul</button>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
